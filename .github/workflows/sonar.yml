name: SonarCloud Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental

      - name: Run tests with coverage
        run: |
          dotnet test tests/OrderFlow.UnitTests \
            --collect:"XPlat Code Coverage" \
            --results-directory tests/OrderFlow.UnitTests/TestResults
          
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
          
      - name: Convert coverage to SonarCloud format
        run: |
          reportgenerator \
            -reports:"tests/OrderFlow.UnitTests/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"tests/OrderFlow.UnitTests/TestResults/coverage-report" \
            -reporttypes:SonarQube
          echo "COVERAGE_PATH=tests/OrderFlow.UnitTests/TestResults/coverage-report/SonarQube.xml" >> $GITHUB_ENV

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        with:
          args: >
            -Dsonar.projectKey=KSIECIUNI0_orderflow-backend
            -Dsonar.organization=ksieciuni0
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.
            -Dsonar.tests=tests/OrderFlow.UnitTests
            -Dsonar.test.inclusions=**/*.cs
            -Dsonar.coverageReportPaths=${{ env.COVERAGE_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
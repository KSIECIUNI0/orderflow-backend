name: SonarCloud Analysis

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.26
          dotnet tool install --global dotnet-sonarscanner --version 5.13.0
          echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarScanner begin
        run: |
          dotnet sonarscanner begin \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test Tests/OrderFlow.UnitTests \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

          dotnet test Tests/OrderFlow.IntegrationTests \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Generate OpenCover report
        run: |
          reportgenerator \
            -reports:TestResults/**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:opencover

      - name: SonarScanner end
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-report/**
            TestResults/**/coverage.cobertura.xml
          retention-days: 7
name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install tools (ReportGenerator & SonarScanner)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.26
          dotnet tool install --global dotnet-sonarscanner --version 5.13.0
          echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarScanner Begin
        run: |
          dotnet sonarscanner begin \
            /k:"KSIECIUNI0_orderflow-backend" \
            /o:"ksieciuni0" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental

      - name: Run tests with coverage (XPlat)
        run: |
          dotnet test \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Convert coverage to SonarQube format
        run: |
          reportgenerator \
            -reports:TestResults/*/coverage.cobertura.xml \
            -targetdir:TestResults/coverage-report \
            -reporttypes:SonarQube

      - name: SonarScanner End
        run: |
          dotnet sonarscanner end \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/coverage-report/SonarQube.xml"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            TestResults/coverage-report/**
            TestResults/*/coverage.cobertura.xml
          retention-days: 7

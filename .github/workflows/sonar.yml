name: SonarCloud Analysis

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install tools (ReportGenerator + SonarScanner)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.26
          dotnet tool install --global dotnet-sonarscanner --version 5.13.0
          echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarScanner Begin
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.sources="src" \
            /d:sonar.tests="tests" \
            /d:sonar.inclusions="**/*.cs" \
            /d:sonar.exclusions="**/bin/**,**/obj/**" \
            /d:sonar.test.exclusions="**/bin/**,**/obj/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**" \
            /d:sonar.cs.opencover.reportsPaths="coverage-report/SonarQube.xml"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test tests/OrderFlow.UnitTests \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults
          dotnet test tests/OrderFlow.IntegrationTests \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Generate SonarQube coverage report
        run: |
          reportgenerator \
            -reports:TestResults/*/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:SonarQube

      - name: SonarScanner End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-report/**
            TestResults/**/coverage.cobertura.xml
          retention-days: 7
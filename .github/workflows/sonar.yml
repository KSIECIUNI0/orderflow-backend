name: SonarCloud Analysis

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test tests/OrderFlow.UnitTests \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults
          dotnet test tests/OrderFlow.IntegrationTests \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Convert coverage reports
        run: reportgenerator \
          -reports:TestResults/**/coverage.cobertura.xml \
          -targetdir:TestResults/report \
          -reporttypes:SonarQube \
          -sourcedirs:$(pwd)/src

      #- name: Upload coverage report
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: coverage-report-xml
      #    path: TestResults/report/SonarQube.xml
      #    retention-days: 1

      - name: Show first 200 lines of SonarQube.xml
        run: head -n 200 TestResults/report/SonarQube.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.coverageReportPaths=TestResults/report/SonarQube.xml
            -Dsonar.sources=src
            -Dsonar.projectBaseDir=.
            -Dsonar.exclusions=**/.github/**,**/Dockerfile
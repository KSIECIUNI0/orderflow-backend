name: SonarCloud Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental

      - name: Run tests with coverage
        run: |
          dotnet test tests/OrderFlow.UnitTests \
            --collect:"XPlat Code Coverage" \
            --results-directory tests/OrderFlow.UnitTests/TestResults

      - name: Convert coverage to Cobertura
        run: |
          report=$(find tests/OrderFlow.UnitTests/TestResults -name "coverage.cobertura.xml" -type f | head -n 1)
          echo "REPORT_PATH=$report" >> $GITHUB_ENV

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        with:
          args: >
            -Dsonar.projectKey=KSIECIUNI0_orderflow-backend
            -Dsonar.organization=ksieciuni0
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.cs.opencover.reportsPaths=${{ env.REPORT_PATH }}
            -Dsonar.tests="tests/OrderFlow.UnitTests/OrderFlow.UnitTests.csproj"
            -Dsonar.test.inclusions="**/*.cs"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
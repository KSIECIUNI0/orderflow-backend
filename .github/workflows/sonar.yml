name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.26
          echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: Begin SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 5.13.0
          echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH
          dotnet sonarscanner begin \
            /k:"KSIECIUNI0_orderflow-backend" \
            /o:"ksieciuni0" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental

      - name: Test with coverage
        run: |
          dotnet test \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Generate SonarQube XML
        run: |
          reportgenerator \
            -reports:TestResults/*/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:SonarQube

      - name: End SonarScanner (NO coverage here!)
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage to SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
          SONAR_PROJECTKEY: "KSIECIUNI0_orderflow-backend"
          SONAR_ORGANIZATION: "ksieciuni0"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report/**
            TestResults/**/coverage.cobertura.xml

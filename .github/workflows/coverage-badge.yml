name: Generate Coverage Badge

on:
  #workflow_run:
  #  workflows: ["Build & Test & Docker"]
  #  types:
  #    - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  coverage-badge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact from previous run
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: "Build & Test & Docker"
          workflow_conclusion: success
          name: coverage-report-text
          path: coverage-report-text
          run_id: ${{ github.event.workflow_run.id }}

      - name: Extract coverage percentage
        id: extract_coverage
        run: |
          FILE=$(ls coverage-report-text/Summary.txt)
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9]+' "$FILE")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "Coverage detected: $COVERAGE%"

      - name: Generate badge
        run: |
          COLOR="red"
          if [ $COVERAGE -ge 90 ]; then COLOR="brightgreen"; fi
          if [ $COVERAGE -ge 80 ] && [ $COVERAGE -lt 90 ]; then COLOR="yellowgreen"; fi
          if [ $COVERAGE -ge 70 ] && [ $COVERAGE -lt 80 ]; then COLOR="yellow"; fi
          
          echo "<svg xmlns='http://www.w3.org/2000/svg' width='140' height='20'>
            <linearGradient id='b' x2='0' y2='100%'>
              <stop offset='0' stop-color='#bbb' stop-opacity='.1'/>
              <stop offset='1' stop-opacity='.1'/>
            </linearGradient>
            <mask id='a'>
              <rect width='140' height='20' rx='3' fill='#fff'/>
            </mask>
            <g mask='url(#a)'>
              <rect width='80' height='20' fill='#555'/>
              <rect x='80' width='60' height='20' fill='$COLOR'/>
              <rect width='140' height='20' fill='url(#b)'/>
            </g>
            <g fill='#fff' text-anchor='middle'
              font-family='Verdana' font-size='11'>
              <text x='40' y='14'>coverage</text>
              <text x='110' y='14'>$COVERAGE%</text>
            </g>
          </svg>" > coverage-badge.svg

      - name: Commit badge to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badge to ${{ env.COVERAGE }}%"
          file_pattern: coverage-badge.svg
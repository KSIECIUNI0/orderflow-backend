name: Build & Test & Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    
jobs: 
  build-test-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Run unit tests with coverage
        run: dotnet test --collect:"XPlat Code Coverage" --data-collector:"XPlat Code Coverage"
        
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
        
      - name: Generate coverage report
        run: reportgenerator -reports:"tests/OrderFlow.UnitTests/TestResults/**/*.xml" -targetdir:coveragereport -reporttypes:TextSummary
        
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9]+' coveragereport/Summary.txt)
          echo "Coverage is $COVERAGE%"
          if [ $COVERAGE -lt 80 ]; then
          echo "❌ Coverage below 80%!"
          exit 1
          fi
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: |
          docker build -t orderflow-api:ci -f ./src/OrderFlow.Api/Dockerfile .
          
      - name: Save Docker image as artifact
        run: |
          docker save orderflow-api:ci | gzip > orderflow-api-ci.tar.gz
          
      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with: 
          name: orderflow-api-image
          path: orderflow-api-ci.tar.gz
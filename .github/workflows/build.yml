name: Build & Test & Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    
jobs: 
  build-test-docker:
    runs-on: ubuntu-latest
    
    env:
      DOTNET_EnableDiagnostics: 1
      TESTCONTAINERS_RYUK_DISABLED: true
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: localhost
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Run Tests (Unit + Integration)
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx" --collect:"XPlat Code Coverage"

      - name: Upload Test Results (TRX)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
        
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
        
      - name: Generate code coverage report
        run: |
          reportgenerator \
            -reports:"tests/OrderFlow.UnitTests/TestResults/**/*.xml" \
            -targetdir:"coverage-report-html" \
            -reporttypes:Html

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report-html
        
      - name: Generate text summary of coverage report
        run: reportgenerator -reports:"tests/OrderFlow.UnitTests/TestResults/**/*.xml" -targetdir:coverage-report-text -reporttypes:TextSummary
        
      - name: Upload text coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-text
          path: coverage-report-text
        
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9]+' coverage-report-text/Summary.txt)
          echo "Coverage is $COVERAGE%"
          if [ $COVERAGE -lt 80 ]; then
            echo "❌ Coverage below 80%!"
            exit 1
          fi
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: |
          docker build -t orderflow-api:ci -f ./src/OrderFlow.Api/Dockerfile .
          
      - name: Save Docker image as artifact
        run: |
          docker save orderflow-api:ci | gzip > orderflow-api-ci.tar.gz
          
      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with: 
          name: orderflow-api-image
          path: orderflow-api-ci.tar.gz
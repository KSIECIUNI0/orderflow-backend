name: Build & Test & Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    
jobs: 
  build-test-docker:
    runs-on: ubuntu-latest
    
    env:
      DOTNET_EnableDiagnostics: 1
      TESTCONTAINERS_RYUK_DISABLED: true
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: localhost
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Run Unit Tests
        run: |
          dotnet test tests/OrderFlow.Domain.Tests/OrderFlow.Domain.Tests.csproj --no-build --configuration Release
          dotnet test tests/OrderFlow.Application.Tests/OrderFlow.Application.Tests.csproj --no-build --configuration Release
        
      - name: Run Integration Tests
        run: |
          dotnet test tests/OrderFlow.Api.IntegrationTests/OrderFlow.Api.IntegrationTests.csproj --no-build --configuration Release
          dotnet test tests/OrderFlow.Infrastructure.IntegrationTests/OrderFlow.Infrastructure.IntegrationTests.csproj --no-build --configuration Release
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: |
          docker build -t orderflow-api:ci -f ./src/OrderFlow.Api/Dockerfile .
          
      - name: Save Docker image as artifact
        run: |
          docker save orderflow-api:ci | gzip > orderflow-api-ci.tar.gz
          
      #- name: Upload Docker artifact
      #  uses: actions/upload-artifact@v4
      #  with: 
      #    name: orderflow-api-image
      #    path: orderflow-api-ci.tar.gz
      #    retention-days: 1
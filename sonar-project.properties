# -------------------------------------------------------
# SonarCloud analysis configuration for OrderFlow
# -------------------------------------------------------

# Project name shown in Sonar
sonar.projectName=OrderFlow

# Source code location
sonar.sources=src

# Test projects location
sonar.tests=Tests

# What files count as test files
sonar.test.inclusions=**/*Tests.cs

# Code coverage reports (Coverlet → Cobertura)
sonar.cs.opencover.reportsPaths=Tests/**/coverage.cobertura.xml

# Exclusions (don't analyze workflows, config, docs)
sonar.exclusions=**/*.yml, **/*.yaml, **/*.md, **/Migrations/**
sonar.csharp.exclusions=**/*.yml, **/*.yaml, **/*.md

# Optional but recommended to reduce noise
sonar.coverage.exclusions=**/Program.cs, **/Startup.cs, **/*Migrations/*.cs

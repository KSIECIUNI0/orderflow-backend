services:
  localstack:
    image: localstack/localstack:latest
    container_name: orderflow-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3, sqs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID='test'
      - AWS_SECRET_KEY='test'
      - AWS_SECRET_ACCESS_KEY='test'
      - DEBUG=1
      - LS_LOG=trace
      - DOCKER_HOST=unix:///var/run/docker.sock
    healthcheck:
      test: [ "CMD", "aws", "--endpoint-url=http://localhost:4566", "sqs", "list-queues" ]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
      
  worker:
    build:
      context: ../src
      dockerfile: OrderFlow.Worker/Dockerfile
    container_name: orderflow-worker
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AWS__ServiceUrl: "http://localstack:4566"
      AWS__Region: "us-east-1"
      Sqs__OrderCreatedQueueUrl: "http://localstack:4566/000000000000/order-created-queue"
    restart: unless-stopped
        
  postgres:
    image: postgres:16
    container_name: orderflow-database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - "./pg-data:/var/lib/postgresql/data"
        
  seq:
    image: datalust/seq:latest
    container_name: orderflow-seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - ./seq-data:/data
        
  alert-service:
    build:
      context: ../src
      dockerfile: OrderFlow.AlertService/Dockerfile
    container_name: orderflow-alertservice
    ports:
      - "8085:8080"
    
  prometheus:
    image: prom/prometheus:latest
    container_name: orderflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus-init/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./prometheus-data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    
  grafana:
    image: grafana/grafana:latest
    container_name: orderflow-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - "./grafana-data:/var/lib/grafana"
      - "./grafana-init/provisioning:/etc/grafana/provisioning"
      - "./grafana-init/dashboards:/var/lib/grafana/dashboards"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
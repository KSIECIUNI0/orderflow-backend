groups:
  - name: orderflow-api
    rules:
      - alert: OrderFlowApiDown
        expr: up{job="orderflow-api"} == 0
        for: 30s
        labels:
          severity: critical
          service: orderflow-api
        annotations:
          summary: "OrderFlow API is down"
          description: "Prometheus cannot scrape metrics from the OrderFlow API for more than 30 seconds."

      - alert: OrderFlowHighHttp5xxRate
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{
              job="orderflow-api",
              http_response_status_code=~"5.."
            }[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{
              job="orderflow-api"
            }[5m]))
          ) > 0.05
          and
          sum(rate(http_server_request_duration_seconds_count{
            job="orderflow-api"
          }[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: orderflow-api
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests to OrderFlow API returned 5xx responses over the last 5 minutes."